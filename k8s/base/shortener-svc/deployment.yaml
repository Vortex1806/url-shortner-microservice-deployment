apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener-svc
  namespace: url-shortener
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shortener-svc
  template:
    metadata:
      labels:
        app: shortener-svc
    spec:
      containers:
        - name: shortener-svc
          image: shubh1840/shortener-svc:e509eb4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: url-shortener-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
